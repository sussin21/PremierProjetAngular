<h1>Conférences ({{ total() }})</h1>
@if (selected(); as conf) { <p role="status">Sélection : {{ conf.name }}</p> }
<div class="cards-container">
  @for (conf of conferances(); track conf.id) {
    <app-conference-card [conference]="conf" (selected)="selected.set($event)" />
  } @empty { <p>Aucune conférence.</p> }
</div>
